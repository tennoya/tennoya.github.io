<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天乃八 ブログ管理</title><style>body{font-family:sans-serif;background:#f7f1e7;color:#211d1a;max-width:700px;margin:30px auto;padding:16px}input,textarea,button{font:inherit;padding:10px;margin:7px 0;max-width:100%;box-sizing:border-box}input:not([type=file]),textarea{width:100%}textarea{height:160px}button{cursor:pointer}article{padding:15px;border-bottom:1px solid #aaa}img{max-width:180px}#editor{display:none}#message{white-space:pre-wrap;color:#754a22}</style></head><body><h1>天乃八 ブログ管理</h1><p><a href="index.html">ホームページへ戻る</a></p><div id="login"><input id="email" type="email" placeholder="管理者メール"><input id="password" type="password" placeholder="パスワード"><button id="login-btn">ログイン</button></div><div id="editor"><button id="logout-btn">ログアウト</button><h2>記事の投稿・編集</h2><input id="title" placeholder="記事タイトル" maxlength="100"><textarea id="body" placeholder="記事の内容"></textarea><label>写真（任意）<input id="photo" type="file" accept="image/*"></label><p>写真は自動縮小して保存します。編集時に写真を選ばなければ元の写真を維持します。</p><button id="save-btn">保存する</button><button id="reset-btn">新規投稿に戻る</button><h2>投稿済みの記事</h2><div id="articles"></div></div><p id="message"></p><script type="module" src="admin.js"></script></body></html>
