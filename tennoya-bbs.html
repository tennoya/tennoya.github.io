<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>天乃八 掲示板</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f0;color:#282522;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;line-height:1.6}main{max-width:760px;margin:0 auto;padding:24px 14px 70px}h1{text-align:center;font-size:1.65rem}h2{font-size:1.1rem;margin:0 0 12px}.panel{background:white;border:1px solid #e3ded5;border-radius:12px;padding:18px;margin:16px 0;box-shadow:0 2px 10px #00000008}label{display:block;font-weight:600;margin:10px 0 4px}input,textarea{width:100%;border:1px solid #b9b2a8;border-radius:7px;padding:10px;font:inherit;background:white}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:7px;background:#46372a;color:white;padding:10px 16px;font:inherit;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#77716a}button.danger{background:#9c3e39}button:disabled{opacity:.5;cursor:wait}.muted{color:#6f6a64;font-size:.92rem}.post{border-top:1px solid #e8e3db;padding:14px 0;overflow-wrap:anywhere}.post:first-child{border-top:0}.posthead{display:flex;gap:12px;align-items:baseline;justify-content:space-between}.posthead time{font-size:.78rem;color:#777}.message{white-space:pre-wrap;margin-top:7px}.status{min-height:1.5em;color:#65451f}.hidden{display:none!important}summary{cursor:pointer;font-weight:600}#adminPanel{margin-top:12px}#adminLogin{margin-top:10px}.reply{margin:12px 0 0 14px;padding:10px 0 10px 13px;border-left:2px solid #d9cec0}.replyform{margin-top:12px;padding:12px;background:#f7f5f0;border-radius:8px}.replyform textarea{min-height:75px}.replyactions{margin-top:6px}.reply .posthead{flex-wrap:wrap}
 .photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid #ddd}.photo-note{font-size:.82rem;color:#777}.photo-preview{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.photo-preview img{width:78px;height:78px;object-fit:cover;border-radius:6px}input[type=file]{padding:8px}.photo-modal{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}.photo-modal img{max-width:100%;max-height:90vh;object-fit:contain}.photo-modal button{position:absolute;right:12px;top:12px;background:#333}
.tn-reactions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.tn-react{background:#fff;border:1px solid #c8b5a1;border-radius:20px;padding:7px 13px;color:#493528;cursor:pointer}.tn-react[aria-pressed="true"]{background:#fce8e7;border-color:#c77b78}.tn-react:disabled{opacity:.6}
.home-back{display:inline-flex;align-items:center;gap:9px;padding:13px 17px;background:#35281e;border:2px solid #fff;border-radius:12px;color:#fff;font-weight:800;text-decoration:none;font-size:1.05rem;box-shadow:0 3px 14px #0004;position:fixed;top:max(12px, env(safe-area-inset-top));left:12px;z-index:9999}body main{padding-top:76px}.home-back:hover{background:#654a36}
</style>
</head>
<body><main>
<a class="home-back" href="./index.html" aria-label="トップページへ戻る"><span aria-hidden="true" style="font-size:1.5em;line-height:1">←</span> トップページへ戻る</a>
<h1>天乃八 掲示板</h1><p class="muted" style="text-align:center">投稿は管理者が確認・承認した後に公開されます。</p>
<section class="panel"><h2>メッセージを投稿</h2><form id="postForm"><label for="name">お名前（30文字以内）</label><input id="name" maxlength="30" required autocomplete="name"><label for="message">メッセージ（1000文字以内）</label><textarea id="message" maxlength="1000" required></textarea><label for="photos">写真（最大3枚・JPEG/PNG/WebP）</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="photoPreview" class="photo-preview"></div><p class="photo-note">写真は小さく圧縮して保存します（画質は下がります）。投稿は管理者の承認後に公開されます。</p><button id="submitPost" type="submit">承認待ちとして投稿</button><p id="postStatus" class="status" role="status"></p></form></section>
<section class="panel"><h2>みんなの投稿</h2><div id="publicPosts"><p class="muted">読み込み中…</p></div></section>
<section class="panel"><details id="adminDetails"><summary>管理者用</summary><div id="adminLogin"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" type="button">ログイン</button></div><div id="adminPanel" class="hidden"><p>管理者としてログイン中</p><button id="logoutBtn" class="secondary" type="button">ログアウト</button><h2>承認待ちの投稿</h2><div id="pendingPosts"><p class="muted">読み込み中…</p></div><h2>承認待ちの返信</h2><div id="pendingReplies"></div></div><p id="adminStatus" class="status" role="status"></p></details></section>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import {getFirestore,collection,query,where,getDocs,addDoc,updateDoc,deleteDoc,doc,getDoc,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyAcdemVICkSXfhZ515fb_CM5pKXbDJiwl4',authDomain:'tennoya-bbs.firebaseapp.com',projectId:'tennoya-bbs',storageBucket:'tennoya-bbs.firebasestorage.app',messagingSenderId:'191259027925',appId:'1:191259027925:web:e5b88686b6634995fcb55c'};
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);
const el=id=>document.getElementById(id);let isAdmin=false;
const fmt=ts=>ts?.toDate?.()?.toLocaleString('ja-JP')||'日時未確定';
let approvedReplies=[],pendingReplies=[];
const make=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;};
// 写真はFirestoreの投稿データ内に保存。1枚約100KB以下に縮小する。
// Firestoreは1文書1MiBまで。無料枠にも容量・読み書き回数の上限があります。
const MAX_PHOTOS=3, MAX_IMAGE_CHARS=150000;
async function compressPhoto(file){
  if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('JPEG・PNG・WebPの写真を選んでください。');
  if(file.size>15*1024*1024)throw Error('元の写真は1枚15MB以下にしてください。');
  const bitmap=await createImageBitmap(file);
  try{
    for(const edge of [900,720,560,440,340]){
      const scale=Math.min(1,edge/Math.max(bitmap.width,bitmap.height));
      const canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(bitmap.width*scale));
      canvas.height=Math.max(1,Math.round(bitmap.height*scale));
      canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);
      for(const quality of [0.68,0.5,0.35]){
        const url=canvas.toDataURL('image/jpeg',quality);
        if(url.length<=MAX_IMAGE_CHARS)return url;
      }
    }
    throw Error('この写真は圧縮できませんでした。別の写真を選んでください。');
  }finally{bitmap.close();}
}
function renderPhotos(item,images){if(!Array.isArray(images)||!images.length)return;const grid=make('div','photo-grid');for(const url of images.slice(0,MAX_PHOTOS)){
  if(typeof url!=='string'||!(url.startsWith('https://')||url.startsWith('data:image/jpeg;base64,')))continue;
  const img=make('img');img.src=url;img.loading='lazy';img.alt='投稿された写真';img.onclick=()=>{const modal=make('div','photo-modal');const big=make('img');big.src=url;big.alt='拡大した写真';const close=make('button','','閉じる');close.onclick=()=>modal.remove();modal.onclick=e=>{if(e.target===modal)modal.remove();};modal.append(big,close);document.body.append(modal);};grid.append(img);
}item.append(grid);}
const photoInput=el('photos');photoInput.addEventListener('change',()=>{const preview=el('photoPreview');preview.replaceChildren();const files=[...photoInput.files];if(files.length>MAX_PHOTOS){el('postStatus').textContent='写真は最大3枚までです。';photoInput.value='';return;}el('postStatus').textContent='';for(const file of files){if(!file.type.startsWith('image/'))continue;const url=URL.createObjectURL(file);const img=make('img');img.src=url;img.onload=()=>URL.revokeObjectURL(url);preview.append(img);}});
function adminButtons(item,kind,id,pending){if(!isAdmin)return;const collectionName=kind==='post'?'posts':'replies';if(pending){const b=make('button','','承認');b.onclick=async()=>{if(!confirm('公開しますか？'))return;b.disabled=true;try{await updateDoc(doc(db,collectionName,id),{status:'approved'});await refresh();el('adminStatus').textContent='承認しました。';}catch(e){alert('承認できません：'+e.message);b.disabled=false;}};item.append(b);}const d=make('button','danger','削除');d.onclick=async()=>{if(!confirm('削除しますか？'))return;d.disabled=true;try{await deleteDoc(doc(db,collectionName,id));await refresh();el('adminStatus').textContent='削除しました。';}catch(e){alert('削除できません：'+e.message);d.disabled=false;}};item.append(d);}
function replyForm(parent,postId,replyTo){const form=make('form','replyform');const title=make('strong','',replyTo?'返信への返信':'この記事に返信');const name=make('input');name.placeholder='お名前（30文字以内）';name.maxLength=30;name.required=true;const message=make('textarea');message.placeholder='返信内容（1000文字以内）';message.maxLength=1000;message.required=true;const send=make('button','','返信を送信');send.type='submit';const cancel=make('button','secondary','キャンセル');cancel.type='button';cancel.onclick=()=>form.remove();const status=make('p','status');form.append(title,name,message,send,cancel,status);form.onsubmit=async e=>{e.preventDefault();const n=name.value.trim(),m=message.value.trim();if(!n||!m)return;send.disabled=true;status.textContent='送信中…';try{await addDoc(collection(db,'replies'),{postId,parentId:replyTo||null,name:n,message:m,status:'approved',createdAt:serverTimestamp()});status.textContent='返信を公開しました。';message.value='';await loadPublic();}catch(err){status.textContent='送信できませんでした：'+(err.code||err.message)+'。Firebaseのルール設定も確認してください。';}finally{send.disabled=false;}};parent.append(form);name.focus();}
function replyTree(parent,postId,parentId,depth=0,seen=new Set()){if(depth>30)return;const rows=approvedReplies.filter(r=>r.data().postId===postId&&(r.data().parentId||null)===parentId).sort((a,b)=>(a.data().createdAt?.toMillis?.()||0)-(b.data().createdAt?.toMillis?.()||0));for(const snap of rows){if(seen.has(snap.id))continue;const d=snap.data(),item=make('div','reply');const head=make('div','posthead');head.append(make('strong','',d.name||'匿名'),make('time','',fmt(d.createdAt)));item.append(head,make('div','message',d.message||''));const btn=make('button','secondary','返信する');btn.type='button';btn.onclick=()=>{const old=item.querySelector(':scope > .replyform');if(old){old.remove();return;}replyForm(item,postId,snap.id);};item.append(btn);adminButtons(item,'reply',snap.id,false);parent.append(item);replyTree(item,postId,snap.id,depth+1,new Set([...seen,snap.id]));}}
// トップページと同一のFirestoreコレクション・匿名ブラウザIDを利用する。
const reactionKey='tennoya-reaction-id';
let reactionBrowserId=localStorage.getItem(reactionKey);
if(!reactionBrowserId){reactionBrowserId='b'+Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem(reactionKey,reactionBrowserId);}
async function reactionsFor(article,postId){
  const wrap=make('div','tn-reactions');article.append(wrap);
  const ref=collection(db,'posts',postId,'reactions');
  const types=[['like','👍 いいね！'],['heart','❤️ ハート']];
  let records=[];
  const load=async()=>{const snap=await getDocs(ref);records=snap.docs;};
  const render=()=>{wrap.replaceChildren();for(const [type,label] of types){
    const ownId=reactionBrowserId+'_'+type;
    const active=records.some(r=>r.id===ownId);
    const total=records.filter(r=>r.data().type===type).length;
    const button=make('button','tn-react',`${label} ${total}`);
    button.type='button';button.setAttribute('aria-pressed',String(active));
    button.onclick=async()=>{button.disabled=true;try{
      const target=doc(db,'posts',postId,'reactions',ownId);
      if(active)await deleteDoc(target);else await setDoc(target,{type,createdAt:serverTimestamp()});
      await load();render();
    }catch(e){console.warn('Reaction:',e);button.disabled=false;alert('反応を保存できませんでした。Firebaseルールを確認してください。');}};
    wrap.append(button);
  }};
  try{await load();render();}catch(e){console.warn('Reactions:',e);wrap.textContent='いいね・ハートを読み込めませんでした。';}
}
function showPosts(target,docs,pending=false){target.replaceChildren();if(!docs.length){target.append(make('p','muted',pending?'承認待ちの投稿はありません。':'まだ投稿はありません。'));return;}docs.sort((a,b)=>(b.data().createdAt?.toMillis?.()||0)-(a.data().createdAt?.toMillis?.()||0));for(const snap of docs){const d=snap.data(),item=make('article','post'),head=make('div','posthead');head.append(make('strong','',d.name||'匿名'),make('time','',fmt(d.createdAt)));item.append(head,make('div','message',d.message||''));renderPhotos(item,d.images);if(!pending)reactionsFor(item,snap.id);if(!pending){const btn=make('button','secondary','返信する');btn.type='button';btn.onclick=()=>{const old=item.querySelector(':scope > .replyform');if(old){old.remove();return;}replyForm(item,snap.id,null);};item.append(btn);}adminButtons(item,'post',snap.id,pending);if(!pending)replyTree(item,snap.id,null);target.append(item);}}
function showPendingReplies(){const target=el('pendingReplies');target.replaceChildren();if(!pendingReplies.length){target.append(make('p','muted','承認待ちの返信はありません。'));return;}for(const snap of pendingReplies){const d=snap.data(),item=make('article','post');item.append(make('strong','',d.name||'匿名'),make('p','message',d.message||''),make('p','muted','元記事ID: '+(d.postId||'')));adminButtons(item,'reply',snap.id,true);target.append(item);}}
async function loadPublic(){try{const [posts,replies]=await Promise.all([getDocs(query(collection(db,'posts'),where('status','==','approved'))),getDocs(query(collection(db,'replies'),where('status','==','approved')))]);approvedReplies=replies.docs;showPosts(el('publicPosts'),posts.docs);}catch(e){el('publicPosts').textContent='読み込めませんでした：'+(e.code||e.message)+'。Firebaseのルール設定を確認してください。';console.error(e);}}
async function loadPending(){if(!isAdmin)return;try{const [posts,replies]=await Promise.all([getDocs(query(collection(db,'posts'),where('status','==','pending'))),getDocs(query(collection(db,'replies'),where('status','==','pending')))]);pendingReplies=replies.docs;showPosts(el('pendingPosts'),posts.docs,true);showPendingReplies();}catch(e){el('pendingPosts').textContent='承認待ちの取得に失敗しました：'+e.message;}}
async function refresh(){await Promise.all([loadPublic(),loadPending()]);}
el('postForm').addEventListener('submit',async ev=>{ev.preventDefault();const name=el('name').value.trim(),message=el('message').value.trim();if(!name||!message||name.length>30||message.length>1000){el('postStatus').textContent='名前とメッセージを入力してください。';return;}el('submitPost').disabled=true;el('postStatus').textContent='送信中…';try{const files=[...photoInput.files];if(files.length>MAX_PHOTOS)throw Error('写真は最大3枚までです。');const images=[];for(let i=0;i<files.length;i++){
  el('postStatus').textContent=`写真を圧縮中（${i+1}/${files.length}）…`;
  images.push(await compressPhoto(files[i]));
}await addDoc(collection(db,'posts'),{name,message,images,createdAt:serverTimestamp(),status:'pending'});el('message').value='';photoInput.value='';el('photoPreview').replaceChildren();el('postStatus').textContent='投稿を受け付けました。管理者の承認後に公開されます。';if(isAdmin)await loadPending();}catch(e){el('postStatus').textContent='投稿できませんでした：'+(e.message||e.code||'通信状況を確認してください。')+' Firestoreのルールも確認してください。';console.error(e);}finally{el('submitPost').disabled=false;}});
el('loginBtn').onclick=async()=>{el('adminStatus').textContent='ログイン中…';el('loginBtn').disabled=true;try{await signInWithEmailAndPassword(auth,el('email').value.trim(),el('password').value);el('password').value='';}catch(e){el('adminStatus').textContent='ログインできませんでした。メールアドレスとパスワードを確認してください。';console.error(e);}finally{el('loginBtn').disabled=false;}};
el('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{isAdmin=false;el('adminPanel').classList.add('hidden');el('adminLogin').classList.remove('hidden');if(!user){el('adminStatus').textContent='';return;}try{const adminSnap=await getDoc(doc(db,'admins',user.uid));if(!adminSnap.exists()||adminSnap.data().role!=='admin'){el('adminStatus').textContent='このアカウントには管理者権限がありません。';await signOut(auth);return;}isAdmin=true;el('adminLogin').classList.add('hidden');el('adminPanel').classList.remove('hidden');el('adminStatus').textContent='';await Promise.all([loadPending(),loadPublic()]);}catch(e){el('adminStatus').textContent='管理者権限を確認できませんでした。';console.error(e);}});
loadPublic();
</script></body></html>
